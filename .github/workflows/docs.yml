name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the `deploy` job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs elan, restores the build cache, and runs `lake build`.
      - name: Install the Lean toolchain and build the library
        uses: leanprover/lean-action@v1

      - name: Build the documentation
        run: |
          cd docbuild
          lake update doc-gen4
          lake build LeanLR:docs

      - name: Upload the documentation as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docbuild/.lake/build/doc
          if-no-files-found: error

      - name: Upload the documentation as a Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    name: Deploy to GitHub Pages
    # Only from `main`; pull requests build the documentation but do not publish it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
